# Dotfiles dependency configuration
# Format:  package:command[,alt_command,...]
#
# • package   — stow package directory name or dependency name
# • command   — CLI command(s) to check installation
#               comma-separated = alternatives (any match → installed)
#               empty = no CLI check available
#
bash:bash
bat:bat
btop:btop
fastfetch:fastfetch
fd:fd
fzf:fzf
git:git
github-cli:gh
glow:glow
hypr:Hyprland,hyprctl
kitty:kitty
lazygit:lazygit
lsd:lsd
micro:micro
mpv:mpv
nvim:nvim
quickshell:quickshell
ripgrep:rg
starship:starship
yazi:yazi
zoxide:zoxide
zsh:zsh
